name: Deploy a GitHub Pages (producción)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Serializado con el despliegue de desarrollo: ambos escriben en gh-pages.
concurrency:
  group: estante-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y compilar
        run: npm run build

      - name: Obtener rama gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publicar en la raíz (conserva /dev)
        env:
          MAINTENANCE: ${{ vars.MAINTENANCE }}
        run: |
          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git ! -name dev -exec rm -rf {} +
          if [ "$MAINTENANCE" = "true" ]; then
            echo "MAINTENANCE=true: publicando pantalla de mantenimiento"
            cp -R maintenance/. gh-pages/
          else
            cp -R dist/. gh-pages/
          fi

      - name: Guardar y subir
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en producción"
          else
            git commit -m "deploy: producción ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
